tickers:
  - SPY

data:
  source: yfinance          # yfinance | csv
  interval: 1d
  csv_folder: data          # used when source=csv (expects <TICKER>.csv with Date,Open,High,Low,Close)

backtest:
  lookback_trading_days: 500
  end_date: null            # e.g. "2025-12-31" or null for latest

run:
  strategies:
    - straddle
    - strangle
  position: short          # long | short
  include_equity_baseline: true

calendar:
  allow_weekend_holds: true

strategy:
  dte_days: 7               # assumed option time-to-expiry at entry (calendar days)
  include_weekends_in_time_decay: true  # Fri→Mon counts extra theta if true
  strike_rounding: 1.0      # 1.0 -> round to nearest $1 ATM strike
  strangle:
    call_otm_pct: 0.02      # +2% OTM call strike vs spot at entry
    put_otm_pct: 0.02       # -2% OTM put strike vs spot at entry
  contract_multiplier: 100
  contracts_per_trade: 6

  vol:
    method: rolling_realized # rolling_realized | fixed
    lookback_days: 30
    fixed_iv: 0.40

  rates:
    risk_free_rate: 0.04

  costs:
    slippage_bps: 0.0       # applies on entry and exit notional (e.g. 5 = 5 bps)

equity:
  shares_per_trade: 100

margin:
  short_options_pct_underlying: 0.20   # rough "capital tied up" proxy for short options

performance:
  initial_balance: 100000
  horizons_trading_days:
    1d: 1
    1w: 5
    1m: 21
    3m: 63
    6m: 126
    1y: 252

plot:
  output_dir: outputs
  save_png: true
  show: true

